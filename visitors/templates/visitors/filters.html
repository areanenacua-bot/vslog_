<div class="card shadow-sm border-0 mb-4"><div class="card-body">
    <form method="get" class="row g-3 align-items-end">
        {% for error in form.non_field_errors %}<div class="col-12 text-danger" role="alert">{{ error }}</div>{% endfor %}
        {% for field in form %}
        <div class="{% if field.name == 'q' %}col-md-6{% else %}col-sm-6 col-lg-3{% endif %}">
            <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}<div class="text-danger small" role="alert">{{ error }}</div>{% endfor %}
        </div>
        {% endfor %}
        <div class="col-12 d-flex gap-2"><button class="btn btn-primary">Apply filters</button><a href="{{ request.path }}" class="btn btn-outline-secondary">Reset</a></div>
    </form>
</div></div>
