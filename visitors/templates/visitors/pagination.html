<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-3">
    <p class="text-muted small mb-0">{{ page_obj.paginator.count }} record{{ page_obj.paginator.count|pluralize }} / Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</p>
    {% if page_obj.has_other_pages %}
    <nav aria-label="Visit pages" class="d-flex gap-2">
        {% if page_obj.has_previous %}<a class="btn btn-sm btn-outline-primary" href="{% querystring page=page_obj.previous_page_number %}">Previous</a>{% endif %}
        {% if page_obj.has_next %}<a class="btn btn-sm btn-outline-primary" href="{% querystring page=page_obj.next_page_number %}">Next</a>{% endif %}
    </nav>
    {% endif %}
</div>
